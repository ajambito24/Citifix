publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 3.15.2
  firebase_auth: 5.6.2
  cloud_firestore: 5.6.12
  firebase_storage: 12.4.10
  

  http: ^1.1.0
  # Image / GPS
  image_picker: ^1.1.2
