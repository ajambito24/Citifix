name: citifix_manila
description: CitiFix Manila Community Issue Reporting System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 3.15.2
  firebase_auth: 5.6.2
  cloud_firestore: 5.6.12
  firebase_storage: 12.4.10
  firebase_messaging: ^15.2.10

  # Heads-up notifications while the app is open (and the high-importance channel)
  flutter_local_notifications: ^19.3.0

  http: ^1.1.0
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  shared_preferences: ^2.5.6
  flutter_animate: ^4.5.2
  firebase_ai: ^2.2.1
  firebase_app_check: ^0.3.2+10
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # ===== ASSETS =====
  assets:
    - assets/logo.png
    - assets/manilacityhallbackground.jpg